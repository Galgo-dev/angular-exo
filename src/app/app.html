@let content = cv();
@let sections = ui().sections;
<app-language-switch />

<div class="pageLayout">
  <app-sidebar
    [profile]="content.profile"
    [contacts]="content.contacts"
    [languages]="content.languages"
    [employmentAid]="content.employmentAid"
  />

  <main class="mainContent">
    <app-profile-summary [segments]="content.profile.summary" />

    <app-section [heading]="sections.experience">
      <app-timeline [items]="content.experiences" />
    </app-section>

    <app-section [heading]="sections.education">
      <app-timeline [items]="content.education" />
    </app-section>

    <app-section [heading]="sections.skills">
      <app-skill-groups [groups]="content.skillGroups" />
    </app-section>

    <app-section [heading]="sections.hobbies">
      <app-hobby-list [hobbies]="content.hobbies" />
    </app-section>

    <footer class="footer">
      {{ content.profile.firstName }} {{ content.profile.lastName }} · {{ ui().footerCv }} · {{ year }}
    </footer>
  </main>
</div>
